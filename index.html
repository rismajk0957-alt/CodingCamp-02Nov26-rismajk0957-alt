
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard">


<header class="header">

    <div>
        <h1 id="greeting">Good Morning!</h1>
        <p>Welcome to your personal dashboard</p>
    </div>

    <div class="clock">
        <h2 id="current-time">00:00:00</h2>
        <p id="current-date">Loading date...</p>
    </div>

    <div class="personal-settings">
        <input
            type="text"
            id="custom-name"
            placeholder="Masukkan nama kamu"
        >

        <button id="save-name">Simpan Nama</button>

        <button id="toggle-theme">🌙 Dark Mode</button>
    </div>

</header>


        <section class="card timer-card">
            <h2>Focus Timer</h2>
            <p>Stay focused and get things done!</p>

            <div class="timer-display" id="timer">
                25:00
            </div>

            <div class="timer-buttons">
                <button id="start-timer">Start</button>
                <button id="stop-timer">Stop</button>
                <button id="reset-timer">Reset</button>
            </div>
        </section>

        <section class="card todo-card">
            <h2>My To-Do List</h2>
            <p>Organize your daily activities</p>

            <div class="todo-input">
                <input
                    type="text"
                    id="task-input"
                    placeholder="Add your task..."
                >
                <button id="add-task">Add Task</button>
            </div>

            <ul id="task-list"></ul>
        </section>

        <section class="card links-card">
            <h2>Quick Links</h2>
            <p>Your favorite websites in one place</p>

            <div class="link-input">
                <input
                    type="text"
                    id="link-name"
                    placeholder="Website name"
                >

                <input
                    type="url"
                    id="link-url"
                    placeholder="Website URL"
                >

                <button id="add-link">Add Link</button>
            </div>

            <div id="quick-links"></div>
        </section>

        <footer>
            <p>Made with R❤️ | My Life Dashboard</p>
        </footer>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
